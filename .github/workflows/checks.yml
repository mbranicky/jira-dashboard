name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Build the packed plugin from a clean extraction
        run: node scripts/check-packed-build.mjs
      - run: npm ci
      - run: python3 -B scripts/test_npm_release.py
      - run: npm run check
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-screenshots
          path: test-results/ui
          if-no-files-found: ignore

  paseo-015:
    strategy:
      matrix:
        include:
          - sdk: 0.15.0
            label: Paseo 0.15 compatibility
          - sdk: 0.15.2
            label: Paseo 0.15.2 compatibility
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - name: Install exact target SDKs without changing the baseline
        env:
          SDK: ${{ matrix.sdk }}
        run: npm install --no-save --ignore-scripts "@getpaseo/plugin@$SDK" "@getpaseo/client@$SDK"
      - run: npm run check
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-screenshots-paseo-${{ matrix.sdk }}
          path: test-results/ui
          if-no-files-found: ignore


  secrets:
    name: History and source secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: npm run audit:history
